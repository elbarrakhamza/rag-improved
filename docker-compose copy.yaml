services:
  postgres:
    build:
      context: ./vector_database
      dockerfile: Dockerfile
    container_name: vector-database
    environment:
      - POSTGRES_HOST
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --appendonly yes

  rag-service:
    container_name: rag-service
    build: 
      context: ./rag
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./rag/data:/app/data
      - ./uploads:/app/uploads
    environment:
      - REDIS_HOST=redis
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
    tty: true

volumes:
  pgdata:
  uploads: