services:
  # Base de données PostgreSQL + pgvector
  postgres:
    build:
      context: ./vector_database
      dockerfile: Dockerfile
    container_name: elevator-postgres
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-rag_db}
      - POSTGRES_USER=${POSTGRES_USER:-rag_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-rag_password}
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - elevator-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_user} -d ${POSTGRES_DB:-rag_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis pour le cache
  redis:
    image: redis:7-alpine
    container_name: elevator-redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - elevator-network
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Service RAG API — domaine assigné via l'onglet Domains de Dokploy
  rag-service:
    build:
      context: ./rag
      dockerfile: Dockerfile
    container_name: elevator-rag-api
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-rag_db}
      - POSTGRES_USER=${POSTGRES_USER:-rag_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-rag_password}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - API_KEY=${API_KEY}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - ENABLE_SMART_PDF=${ENABLE_SMART_PDF:-true}
      - ENABLE_VISION_LLM=${ENABLE_VISION_LLM:-true}
      - OCR_LANG=${OCR_LANG:-fra+ara}
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./rag/data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
    networks:
      - elevator-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend — domaine assigné via l'onglet Domains de Dokploy
  frontend:
    image: nginx:alpine
    container_name: elevator-frontend
    expose:
      - "80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - elevator-network
    depends_on:
      - rag-service

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  elevator-network:
    driver: bridge